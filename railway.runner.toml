# Near-zero-cost deploy: the trend allocator as a Railway cron job (python -m mqmas.runner).
# The container starts every hour, runs for about a minute (stop checks; the daily rebalance after
# 00:00 UTC), and exits. Railway bills only while it runs: roughly US$ 0.10–0.30 a month, inside the
# Free plan's US$ 1 monthly credit. Use it by setting the service's "Config file path" to railway.runner.toml
# and mounting a volume at /data (the SQLite state lives there).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m mqmas.runner"
cronSchedule = "7 * * * *"
# Never restart a finished run: the next one comes from the schedule. A failed run shows up as failed in
# Railway, skips the heartbeat ping and sends the error to Telegram.
restartPolicyType = "NEVER"
numReplicas = 1
