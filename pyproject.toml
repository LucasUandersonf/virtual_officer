[project]
name = "mq-mas"
version = "1.0.0"
description = "Micro-Quant Multi-Agent System — autonomous, capital-preserving BTC/USDT spot desk with a pixel-art office"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["UP017", "B008", "E731", "UP037", "UP042"]

[tool.ruff.lint.per-file-ignores]
"mqmas/persistence/db.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
