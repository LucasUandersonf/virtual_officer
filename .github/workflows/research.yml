name: research
# Runs a research lab on real Binance candles (public market-data mirror) at zero cost and keeps the
# JSON report as an artifact. Runs when the trend model or its study change, on demand, and monthly.
on:
  workflow_dispatch:
    inputs:
      lab:
        description: "lab to run (trend, arena, …)"
        default: trend
  push:
    paths:
      - "mqmas/trend/**"
      - "mqmas/research/trend_study.py"
      - "mqmas/research/waves.py"
      - "mqmas/runner.py"
      - ".github/workflows/research.yml"
  schedule:
    - cron: "17 3 2 * *"
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MQMAS_PUBLIC_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m mqmas.research ./research ${{ github.event.inputs.lab || 'trend' }}
      - if: ${{ !github.event.inputs.lab }}
        run: python -m mqmas.research ./research waves
      - name: paper run of the live allocator on today's market (smoke test, no orders)
        run: |
          DB_PATH=./research/runner.db TREND_CAPITAL_USDT=120 python -m mqmas.runner
          DB_PATH=./research/runner.db TREND_CAPITAL_USDT=120 python -m mqmas.runner
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.event.inputs.lab || 'trend' }}
          path: research/*_report.json
